name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          # replay the whole environment of the main theorems through the kernel, from scratch
          leanchecker: "true"
          leanchecker-args: "--fresh Bsdfs.MainTheorems"
